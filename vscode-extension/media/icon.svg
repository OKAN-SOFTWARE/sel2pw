<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background — deep Selenium green, same family as bdd2pw -->
  <rect width="128" height="128" rx="20" fill="#1F5F3F"/>

  <!-- Left window: Selenium source (lighter panel) -->
  <rect x="18" y="34" width="40" height="52" rx="4" fill="#43C463"/>
  <rect x="18" y="34" width="40" height="10" rx="4" fill="#2FA34E"/>
  <circle cx="24" cy="39" r="1.8" fill="#1F5F3F"/>
  <circle cx="30" cy="39" r="1.8" fill="#1F5F3F"/>
  <circle cx="36" cy="39" r="1.8" fill="#1F5F3F"/>
  <rect x="24" y="52" width="24" height="3" rx="1" fill="#ffffff" opacity="0.8"/>
  <rect x="24" y="60" width="18" height="3" rx="1" fill="#ffffff" opacity="0.55"/>
  <rect x="24" y="68" width="26" height="3" rx="1" fill="#ffffff" opacity="0.55"/>
  <rect x="24" y="76" width="14" height="3" rx="1" fill="#ffffff" opacity="0.55"/>

  <!-- Arrow → -->
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="62" y1="64" x2="76" y2="64"/>
    <polyline points="70,58 78,64 70,70"/>
  </g>

  <!-- Right window: Playwright destination (brand-blue) -->
  <rect x="82" y="34" width="40" height="52" rx="4" fill="#2680EB"/>
  <rect x="82" y="34" width="40" height="10" rx="4" fill="#1A67C0"/>
  <circle cx="88" cy="39" r="1.8" fill="#0F3D75"/>
  <circle cx="94" cy="39" r="1.8" fill="#0F3D75"/>
  <circle cx="100" cy="39" r="1.8" fill="#0F3D75"/>
  <rect x="88" y="52" width="24" height="3" rx="1" fill="#ffffff" opacity="0.9"/>
  <rect x="88" y="60" width="18" height="3" rx="1" fill="#ffffff" opacity="0.7"/>
  <rect x="88" y="68" width="26" height="3" rx="1" fill="#ffffff" opacity="0.7"/>
  <rect x="88" y="76" width="14" height="3" rx="1" fill="#ffffff" opacity="0.7"/>
</svg>
